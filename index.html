<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="logo.png">
<title>მდელო</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#111;overflow:hidden;width:100vw;height:100dvh;}
#mapWrap{width:100vw;height:100dvh;overflow:scroll;cursor:grab;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;position:relative;}
#mapWrap:active{cursor:grabbing;}
#sizer{position:absolute;top:0;left:0;pointer-events:none;}
#mapInner{position:absolute;top:0;left:0;transform-origin:0 0;}
#mapInner canvas,#mapInner img{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;padding:7px 12px;background:rgba(13,17,23,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(48,54,61,0.35);pointer-events:none;}
#topbar>*{pointer-events:auto;}
#mapTitle{font:13px sans-serif;color:rgba(230,237,243,0.65);}
#termBtn{display:none;background:transparent;border:none;color:rgba(230,237,243,0.65);font:13px sans-serif;cursor:pointer;padding:0;letter-spacing:.01em;transition:color .15s;pointer-events:auto;}
#termBtn:hover{color:#00ff88;}
@media(display-mode:standalone){#termBtn{display:block!important;}#mapTitle{display:none!important;}}
#termBtn .tm-tilde{color:#00ff88;margin-right:2px;opacity:.8;}
#mdlTerm{position:fixed;top:0;left:0;right:0;height:46vh;z-index:998;display:flex;flex-direction:column;background:rgba(0,0,0,.25);backdrop-filter:blur(2px) saturate(.75);-webkit-backdrop-filter:blur(2px) saturate(.75);border-bottom:1px solid rgba(0,255,136,.15);box-shadow:0 6px 32px rgba(0,0,0,.55);transform:translateY(-100%);transition:transform 220ms cubic-bezier(.22,1,.36,1);overflow:hidden;}
#mdlTerm.open{transform:translateY(0);}
#mdlTerm.tmfull{height:100vh;border-bottom:none;}
.tm-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;}
.tm-wm img{width:78%;max-width:340px;opacity:.15;filter:grayscale(1);user-select:none;}
.tm-hdr{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:6px 13px;border-bottom:1px solid rgba(0,255,136,.09);flex-shrink:0;background:rgba(0,0,0,.18);}
.tm-path{color:#00ff88;font-family:'Courier New',monospace;font-size:11px;letter-spacing:.07em;opacity:.75;}
.tm-path em{opacity:.38;font-style:normal;}
.tm-ctrl{display:flex;gap:5px;}
.tm-ctrl button{background:transparent;border:1px solid rgba(0,255,136,.16);color:rgba(0,255,136,.5);font-family:'Courier New',monospace;font-size:11px;padding:2px 8px;cursor:pointer;border-radius:2px;transition:all .12s;line-height:1.4;}
.tm-ctrl button:hover{background:rgba(0,255,136,.08);border-color:rgba(0,255,136,.38);color:#00ff88;}
.tm-ctrl button.on{background:rgba(0,255,136,.1);border-color:rgba(0,255,136,.35);color:#00ff88;}
#tmOut{position:relative;z-index:1;flex:1;overflow-y:auto;padding:8px 15px 4px;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin;scrollbar-color:rgba(0,255,136,.15) transparent;}
#tmOut::-webkit-scrollbar{width:3px;}
#tmOut::-webkit-scrollbar-thumb{background:rgba(0,255,136,.15);border-radius:2px;}
.tl{font-family:'Courier New',Consolas,monospace;font-size:13px;line-height:1.55;animation:tlfi 75ms ease;}
@keyframes tlfi{from{opacity:0;transform:translateX(-3px)}to{opacity:1}}
.tl.ti{color:#00ff88;}.tl.ti::before{content:'> ';opacity:.42;}
.tl.tok{color:#00ff88;opacity:.7;}.tl.tok::before{content:'\2713 ';}
.tl.tnf{color:#ffcc00;opacity:.8;}.tl.tnf::before{content:'\00b7 ';}
.tl.ter{color:#ff5555;}.tl.ter::before{content:'\2717 ';}
.tl.tdm{color:#aaa;font-size:12px;}
.tl.tsy{color:#00ff88;font-size:11px;letter-spacing:.05em;opacity:.7;}.tl.tsy::before{content:'# ';}
.tl.chat{color:#e6edf3;}.tl.chat::before{content:'';}
#tmSlashBtn{background:transparent;border:1px solid rgba(0,255,136,.18);color:rgba(0,255,136,.65);font-family:'Courier New',monospace;font-size:15px;font-weight:bold;padding:1px 8px;cursor:pointer;border-radius:2px;transition:all .12s;flex-shrink:0;line-height:1.5;margin-right:5px;}
#tmSlashBtn:hover{background:rgba(0,255,136,.09);border-color:rgba(0,255,136,.45);color:#00ff88;}
#tmSlashBtn:active{background:rgba(0,255,136,.18);}
.tm-ir{position:relative;z-index:1;display:flex;flex-direction:column;border-top:1px solid rgba(0,255,136,.09);background:rgba(0,0,0,.2);flex-shrink:0;}
.tm-ir-row{display:flex;align-items:center;padding:7px 13px;}
.tm-pr{color:#00ff88;font-family:'Courier New',monospace;font-size:13px;margin-right:7px;opacity:.45;white-space:nowrap;}
#tmIn{flex:1;background:transparent;border:none;outline:none;color:#00ff88;font-family:'Courier New',Consolas,monospace;font-size:13px;caret-color:#00ff88;}
#tmIn::placeholder{color:rgba(0,255,136,.2);}
#tmHint{color:rgba(0,255,136,.2);font-family:'Courier New',monospace;font-size:13px;pointer-events:none;user-select:none;}
#tmTa{display:none;background:transparent;border:none;border-bottom:1px solid rgba(0,255,136,.09);outline:none;color:#00ff88;font-family:'Courier New',Consolas,monospace;font-size:13px;caret-color:#00ff88;resize:none;padding:8px 13px;line-height:1.55;min-height:64px;max-height:120px;overflow-y:auto;}
#tmTa::placeholder{color:rgba(0,255,136,.2);}
#tmMlBtn{background:transparent;border:1px solid rgba(0,255,136,.18);color:rgba(0,255,136,.65);font-family:'Courier New',monospace;font-size:13px;font-weight:bold;padding:1px 7px;cursor:pointer;border-radius:2px;transition:all .12s;flex-shrink:0;line-height:1.5;margin-right:5px;}
#tmMlBtn:hover{background:rgba(0,255,136,.09);border-color:rgba(0,255,136,.45);color:#00ff88;}
#tmMlBtn:active{background:rgba(0,255,136,.18);}
#tmMlBtn.on{background:rgba(0,255,136,.1);border-color:rgba(0,255,136,.35);color:#00ff88;}
#tmSendBtn{display:none;background:transparent;border:1px solid rgba(0,255,136,.18);color:rgba(0,255,136,.65);font-family:'Courier New',monospace;font-size:14px;padding:2px 10px;cursor:pointer;border-radius:2px;transition:all .12s;flex-shrink:0;line-height:1.5;margin-left:auto;}
#tmSendBtn:active{background:rgba(0,255,136,.18);}
#menuBtn{position:fixed;top:8px;right:12px;z-index:30;width:36px;height:36px;border-radius:8px;background:rgba(22,27,34,0.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(48,54,61,0.6);color:rgba(180,190,200,0.85);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#menuBtn:hover{border-color:#58a6ff;color:#58a6ff;}
#gameMenu{display:none;position:fixed;inset:0;z-index:40;background:rgba(13,17,23,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex-direction:column;align-items:center;justify-content:flex-start;padding:10px 16px 20px;overflow-y:auto;}
#gameMenu.open{display:flex;}
.gmClose{position:fixed;top:10px;right:12px;z-index:41;background:none;border:none;color:rgba(139,148,158,0.8);font-size:22px;cursor:pointer;}
#gameMenu.ov-open .gmClose{display:none;}
/* ── drill-down menu ── */
#gmContent{width:100%;max-width:420px;display:flex;flex-direction:column;gap:0;}
/* breadcrumb: single line, horizontally scrollable, right edge clears the fixed ✕ button */
#gmBreadcrumb{display:flex;align-items:center;gap:6px;padding:0 40px 10px 0;min-height:28px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none;visibility:hidden;}
#gmBreadcrumb::-webkit-scrollbar{display:none;}
#gmBreadcrumb.visible{visibility:visible;}
.gm-bc-sep{color:#444c56;font-size:11px;flex-shrink:0;}
.gm-bc-part{font:12px sans-serif;color:#58a6ff;cursor:pointer;padding:2px 4px;border-radius:4px;transition:background .15s;flex-shrink:0;}
.gm-bc-part:hover{background:rgba(88,166,255,0.12);}
.gm-bc-part.current{color:rgba(180,190,200,0.6);cursor:default;pointer-events:none;}
.gm-panel-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .15s;user-select:none;}
.gm-panel-item:hover{background:rgba(255,255,255,0.05);}
.gm-panel-item .gm-pi-icon{font-size:16px;flex-shrink:0;}
.gm-panel-item .gm-pi-title{font:14px/1.3 sans-serif;color:rgba(220,228,236,0.92);flex:1;}
.gm-panel-item .gm-pi-arrow{font-size:10px;color:#444c56;flex-shrink:0;}
.gm-panel-item .gm-pi-textbtn{font-size:14px;flex-shrink:0;opacity:0.7;padding:2px;}
.gm-panel-item .gm-pi-textbtn:hover{opacity:1;}
.gm-panel-item.has-items .gm-pi-title{color:rgba(220,228,236,0.75);}
#gmOverlay{display:none;position:absolute;inset:0;background:rgba(13,17,23,0.97);flex-direction:column;z-index:2;border-radius:inherit;}
#gmOverlay.open{display:flex;}
#gmOverlayHdr{display:flex;align-items:center;gap:8px;padding:0 0 12px;border-bottom:1px solid rgba(48,54,61,0.5);flex-shrink:0;}
#gmOverlayTitle{font:14px sans-serif;color:rgba(220,228,236,0.92);flex:1;}
#gmOverlayClose{background:none;border:none;color:rgba(139,148,158,0.8);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;}
#gmOverlayBody{flex:1;overflow-y:auto;padding-top:12px;}
.gm-progress-row{display:flex;align-items:center;gap:8px;padding:4px 0;}
.gm-progress-label{font:13px sans-serif;color:rgba(180,190,200,0.85);min-width:100px;}
.gm-bar{flex:1;height:8px;background:rgba(48,54,61,0.6);border-radius:4px;overflow:hidden;}
.gm-bar-fill{height:100%;border-radius:4px;background:#4ade80;transition:width .3s;}
.gm-bar-pct{font:11px monospace;color:#8b949e;min-width:30px;text-align:right;}
.gm-item{font:14px/1.4 sans-serif;color:rgba(180,190,200,0.88);padding:1px 0;}
.gm-todo-row{display:flex;align-items:flex-start;gap:8px;padding:4px 0;cursor:pointer;font:14px/1.4 sans-serif;color:rgba(180,190,200,0.88);}
.gm-todo-row:hover{background:rgba(255,255,255,0.04);border-radius:6px;}
.gm-todo-box{flex-shrink:0;font-size:15px;line-height:1.4;}
.gm-todo-label{flex:1;}
.gm-todo-row.checked .gm-todo-label{color:rgba(140,150,160,0.6);text-decoration:line-through;}
.info{position:fixed;bottom:7px;right:10px;font:10px monospace;color:rgba(72,79,88,0.6);pointer-events:none;}
.hotspot{position:absolute;cursor:pointer;z-index:5;overflow:visible;background:none!important;border:none!important;}
.hs-dot{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.6);box-shadow:0 0 4px rgba(255,255,255,0.8);pointer-events:none;}
.hs-marker{position:absolute;top:-8px;left:50%;transform:translate(-50%,-50%);font-size:18px;font-weight:bold;font-family:sans-serif;line-height:1;pointer-events:auto;-webkit-text-stroke:2px rgba(0,0,0,0.9);paint-order:stroke fill;}
.hs-marker.exc{color:#f0a500;}.hs-marker.q{color:#e8e8e8;}.hs-marker.chat{color:#4ade80;}
#hsPopup{display:none;position:fixed;z-index:50;left:50%!important;top:20%!important;transform:translateX(-50%)!important;background:rgba(22,27,34,0.4);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(88,166,255,0.35);border-radius:10px;padding:12px 34px 12px 14px;width:min(92vw,400px);font:13px/1.7 sans-serif;color:rgba(200,210,220,0.92);flex-direction:column;}
#hsPopup.show{display:flex;}
#hsPopupTitle{font-size:14px;font-weight:600;color:#ffffff;margin-bottom:5px;padding-right:20px;flex-shrink:0;}
#hsPopupScroll{height:88px;overflow-y:auto;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 15%,black 88%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,black 15%,black 88%,transparent 100%);scrollbar-width:none;padding-bottom:8px;}
#hsPopupScroll::-webkit-scrollbar{display:none;}
#hsPopupBtns{display:flex;flex-direction:column;gap:6px;flex-shrink:0;max-height:0;overflow:hidden;opacity:0;transition:max-height 0.5s cubic-bezier(0.4,0,0.2,1),margin-top 0.5s ease,opacity 0.4s ease 0.2s;}
#hsPopupBtns.visible{max-height:400px;margin-top:10px;opacity:1;}
#hsClose{position:absolute;top:10px;right:12px;background:none;border:none;color:#8b949e;font-size:18px;cursor:pointer;line-height:1;}
.hs-area{border:none;background:transparent;cursor:pointer;border-radius:4px;}
.hotspot.no-interact{cursor:default;pointer-events:none;}
.hs-area:hover{background:rgba(255,220,80,0.07);}
#areaPopup{display:none;position:fixed;z-index:60;left:50%!important;top:20%!important;transform:translateX(-50%)!important;background:rgba(22,27,34,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(240,165,0,0.45);border-radius:10px;padding:11px 14px 12px;flex-direction:column;gap:8px;min-width:200px;max-width:min(88vw,320px);}
#areaPopup.show{display:flex;}
#areaPopup .ap-close{position:absolute;top:7px;right:10px;background:none;border:none;color:#8b949e;font-size:15px;cursor:pointer;}
#areaPopup .ap-title{font-size:14px;font-weight:600;color:#f0a500;padding-right:18px;}
#areaPopup .ap-tip{font-size:12px;color:#8b949e;line-height:1.5;}
#hsPopup a{color:#58a6ff;text-decoration:none;}#hsPopup a:hover{text-decoration:underline;}
#questBtn{position:fixed;bottom:14px;left:14px;z-index:30;width:38px;height:38px;border-radius:50%;background:rgba(22,27,34,0.3);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(48,54,61,0.6);color:rgba(180,190,200,0.8);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#questPopup{display:none;position:fixed;bottom:62px;left:14px;z-index:30;background:rgba(22,27,34,0.3);backdrop-filter:blur(2px);border:1px solid rgba(48,54,61,0.5);border-radius:10px;padding:12px 14px;max-width:min(88vw,420px);font:13px/1.6 sans-serif;color:rgba(200,210,220,0.9);white-space:pre-wrap;}
#notifBar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;align-items:center;pointer-events:auto;}
#pushBtn{width:44px;height:44px;border-radius:10px;border:2px solid #58a6ff;background:rgba(13,17,23,0.2);backdrop-filter:blur(1px);color:#58a6ff;font-size:18px;cursor:pointer;position:fixed;bottom:14px;right:14px;z-index:30;opacity:0.82;box-shadow:0 2px 12px rgba(0,0,0,0.4);}
#pushBtn:active{opacity:1;}
.ncard{width:44px;height:44px;border-radius:10px;border:2px solid var(--nc);background:rgba(13,17,23,0.2);backdrop-filter:blur(1px);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative;box-shadow:0 2px 12px rgba(0,0,0,0.4);opacity:0.82;}
.ncard:active{opacity:1;}
.ncard.pulse{animation:npulse 1.2s infinite;}
@keyframes npulse{0%,100%{box-shadow:0 0 0 0 var(--nc);}50%{box-shadow:0 0 0 6px transparent;}}
.ncard[data-type="info"]{--nc:#58a6ff;}.ncard[data-type="warning"]{--nc:#f0a500;}.ncard[data-type="danger"]{--nc:#fb8f44;}.ncard[data-type="emergency"]{--nc:#f85149;}.ncard[data-type="done"]{--nc:#4ade80;}.ncard[data-type="project"]{--nc:#c084fc;}
#notifPopup{display:none;position:fixed;z-index:70;background:rgba(13,17,23,0.1);backdrop-filter:blur(1px);border:2px solid var(--nc,#58a6ff);border-radius:12px;padding:14px 40px 14px 14px;max-width:min(88vw,360px);font:13px/1.6 sans-serif;color:#e6edf3;box-shadow:0 4px 24px rgba(0,0,0,0.5);}
#notifPopup.show{display:block;}
#notifPopup .np-type{font-size:11px;color:var(--nc,#58a6ff);font-weight:600;margin-bottom:4px;text-transform:uppercase;}
#notifPopup .np-sender{font-size:11px;color:#8b949e;margin-bottom:8px;}
#notifPopup .np-text{font-size:14px;font-weight:600;color:#fff;margin-bottom:6px;}
#notifPopup .np-detail{font-size:12px;color:rgba(180,200,220,0.85);}
#notifPopup .np-area{margin-top:10px;padding:6px 10px;background:rgba(240,165,0,0.1);border:1px solid rgba(240,165,0,0.3);border-radius:6px;font-size:12px;color:#f0a500;cursor:pointer;text-align:center;}
#consensusPopup{display:none;position:fixed;top:32px;left:0;right:0;bottom:0;z-index:90;background:rgba(13,17,23,0.86);backdrop-filter:blur(4px);flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;opacity:0;transition:opacity .2s;}
#consensusPopup.show{opacity:1;}
#consensusPopup #cpClose{position:absolute;top:18px;right:18px;background:none;border:1px solid #30363d;color:#e6edf3;border-radius:8px;width:32px;height:32px;font-size:14px;cursor:pointer;}
#consensusPopup .cp-logo{width:112px;height:112px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:56px;background:rgba(255,255,255,0.04);border:1px solid #30363d;}
#consensusPopup .cp-vote-row{display:flex;gap:18px;}
#consensusPopup .cp-vote-btn{min-width:104px;height:44px;padding:0 16px;border-radius:22px;border:2px solid #30363d;background:#161b22;font-size:14px;font-weight:600;color:#8b949e;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,border-color .15s,background .15s,color .15s;opacity:0.7;}
#consensusPopup .cp-vote-btn:active{transform:scale(0.95);}
#consensusPopup .cp-vote-btn.sel{opacity:1;transform:scale(1.05);}
#consensusPopup .cp-vote-btn#cpYes.sel{border-color:#55cc33;background:rgba(85,204,51,0.12);color:#55cc33;}
#consensusPopup .cp-vote-btn#cpNo.sel{border-color:#f85149;background:rgba(248,81,73,0.12);color:#f85149;}
#consensusPopup .cp-question{font-size:16px;font-weight:700;color:#fff;text-align:center;max-width:340px;}
#consensusPopup .cp-detail{font-size:12px;color:#8b949e;text-align:center;max-width:340px;margin-top:-6px;}
#consensusPopup .cp-status{font-size:12px;color:#55aa33;font-weight:600;}
#consensusPopup .cp-locked{font-size:11px;color:#8b949e;}
#consensusPopup .cp-feed{width:100%;max-width:320px;max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
#consensusPopup .cp-feed-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#e6edf3;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:6px 10px;}
#consensusPopup .cp-feed-empty{font-size:11px;color:#8b949e;text-align:center;}
#notifClose{position:absolute;top:10px;right:12px;background:none;border:none;color:#8b949e;font-size:18px;cursor:pointer;line-height:1;}
#spotLinkPopup{display:none;position:fixed;z-index:60;background:rgba(22,27,34,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #58a6ff;border-radius:10px;padding:11px 13px;width:200px;flex-direction:column;gap:7px;box-shadow:0 4px 24px rgba(0,0,0,0.5);}
#spotLinkPopup.show{display:flex;}
#spotLinkPopup .slClose{position:absolute;top:7px;right:9px;background:none;border:none;color:#8b949e;font-size:15px;cursor:pointer;line-height:1;}
#spotLinkPopup .slCoords{font-size:12px;color:rgba(200,210,220,0.9);padding-right:18px;}
.slzBtn{flex:1;height:27px;background:rgba(13,17,23,0.8);border:1px solid rgba(48,54,61,0.7);color:#8b949e;font-size:12px;border-radius:5px;cursor:pointer;font-family:monospace;}
.slzBtn.on{border-color:#58a6ff;color:#58a6ff;background:rgba(88,166,255,0.08);}
#spotLinkPopup .slCopy{height:32px;background:rgba(13,17,23,0.8);border:2px solid #4ade80;color:#4ade80;font-size:12px;border-radius:5px;cursor:pointer;}

    img.onload = () => { sheets.set(url, img); tryDone(); };

    img.onload = () => { b64imgs.set(t.id, img); tryDone(); };
    img.onerror = () => tryDone();
    img.src = t.src;
  });
})();

<script>// unlock.js — Mdelo Viewer: Flag-based Unlock Engine
// No ES modules. Everything on window.
// Load after: chat.js (for _tmPrint fallback awareness)
// Provides: canTrigger, completeDialog, flagSet/Clear/Has/List/Reset,
//           unlockHandleCmd (/flag terminal commands), unlockInit

(function (global) {
  'use strict';

  var STORAGE_KEY = 'mdelo_flags';

  // ─────────────────────────────────────────────────────────────────────────
  // Flag storage (localStorage → JSON array of strings)
  // ─────────────────────────────────────────────────────────────────────────
  function _load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function _save(arr) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch (e) {}
  }

  // ─────────────────────────────────────────────────────────────────────────
  // Public Flag API
  // ─────────────────────────────────────────────────────────────────────────
  function flagSet(name) {
    name = String(name).trim();
    if (!name) return false;
    var arr = _load();
    if (arr.indexOf(name) === -1) { arr.push(name); _save(arr); }
    return true;
  }

  function flagClear(name) {
    name = String(name).trim();
    var arr = _load();
    var idx = arr.indexOf(name);
    if (idx === -1) return false;
    arr.splice(idx, 1);
    _save(arr);
    return true;
  }

  function flagHas(name) {
    return _load().indexOf(String(name).trim()) !== -1;
  }

  function flagList() {
    return _load().slice();
  }

  function flagReset() {
    _save([]);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // canTrigger(dialog)
  // Returns true if all dialog.requires.flags are set.
  // An unlocked dialog also needs flag "dialog_unlocked:<id>" if it was
  // originally locked (i.e. it appears in another dialog's unlock_dialogs).
  // ─────────────────────────────────────────────────────────────────────────
  function canTrigger(dialog) {
    if (!dialog) return false;
    var req = dialog.requires;

    // If dialog has no requirements it's always available
    if (!req) return true;

    var stored = _load();

    // Check required flags
    var need = req.flags || [];
    for (var i = 0; i < need.length; i++) {
      if (stored.indexOf(need[i]) === -1) return false;
    }

    // Optional: min_level guard (level system TBD)
    // if (dialog.min_level && (global.playerLevel || 0) < dialog.min_level) return false;

    return true;
  }

  // ─────────────────────────────────────────────────────────────────────────
  // completeDialog(dialog)
  // Applies dialog.on_complete: set_flags, unlock_areas, unlock_dialogs.
  // Fires CustomEvent "mdelo:dialog_complete" on document.
  // ─────────────────────────────────────────────────────────────────────────
  function completeDialog(dialog) {
    if (!dialog || !dialog.on_complete) return;
    var oc = dialog.on_complete;

    (oc.set_flags || []).forEach(function (f) { flagSet(f); });
    (oc.unlock_areas || []).forEach(function (areaId) { _unlockArea(areaId); });
    (oc.unlock_dialogs || []).forEach(function (dialogId) { flagSet('dialog_unlocked:' + dialogId); });

    // set_markers: #! ?კარიბჭე ~სახლი etc
    (oc.set_markers || []).forEach(function (m) {
      var el = document.querySelector('.hotspot[data-title="' + m.title + '"]:not(.hs-area)');
      if (!el) return;
      if (typeof _applyMarkerDom === 'function') _applyMarkerDom(el, m.mk);
      var oi = el.dataset.oi;
      if (oi != null && typeof _OBJS !== 'undefined' && _OBJS[+oi])
        _OBJS[+oi].marker = m.mk === '~' ? '...' : m.mk;
    });

    try {
      document.dispatchEvent(new CustomEvent('mdelo:dialog_complete', { detail: { dialog: dialog } }));
    } catch (e) {}
  }

  // ─────────────────────────────────────────────────────────────────────────
  // parseUnlockHeaders / unparseUnlockHeaders
  // Shared with runtime.js (_applyDlgOverride, dlgGetCurrentDsl)
  // ─────────────────────────────────────────────────────────────────────────
  function parseUnlockHeaders(raw) {
    var lines = raw.split('\n'), dslLines = [], requires = null, on_complete = null;
    lines.forEach(function(line) {
      var m;
      if ((m = line.match(/^#\?\s*(.+)/))) {
        var flags = m[1].split(/\s+/).map(function(s){ return s.trim(); }).filter(Boolean);
        if (flags.length) requires = { flags: flags };
      } else if ((m = line.match(/^#!\s*(.+)/))) {
        var tokens = m[1].split(/\s+/).filter(Boolean);
        var oc = { set_flags: [], unlock_dialogs: [], unlock_areas: [], set_markers: [] };
        tokens.forEach(function(t) {
          var ch = t.charAt(0);
          if      (ch === '>') oc.unlock_dialogs.push(t.slice(1));
          else if (ch === '*') oc.unlock_areas.push(t.slice(1));
          else if (ch === '!' || ch === '?' || ch === '~' || ch === '-')
            oc.set_markers.push({ mk: ch === '-' ? '' : ch, title: t.slice(1) });
          else oc.set_flags.push(t);
        });
        if (!oc.set_flags.length)      delete oc.set_flags;
        if (!oc.unlock_dialogs.length) delete oc.unlock_dialogs;
        if (!oc.unlock_areas.length)   delete oc.unlock_areas;
        if (!oc.set_markers.length)    delete oc.set_markers;
        if (Object.keys(oc).length)    on_complete = oc;
      } else { dslLines.push(line); }
    });
    return { dsl: dslLines.join('\n'), requires: requires, on_complete: on_complete };
  }

  function unparseUnlockHeaders(o) {
    var lines = [];
    if (o.requires && o.requires.flags && o.requires.flags.length)
      lines.push('#? ' + o.requires.flags.join(' '));
    if (o.on_complete) {
      var oc = o.on_complete, tokens = [];
      (oc.set_flags      || []).forEach(function(f){ tokens.push(f); });
      (oc.unlock_dialogs || []).forEach(function(f){ tokens.push('>'+f); });
      (oc.unlock_areas   || []).forEach(function(f){ tokens.push('*'+f); });
      (oc.set_markers    || []).forEach(function(m){ tokens.push((m.mk||'-')+m.title); });
      if (tokens.length) lines.push('#! ' + tokens.join(' '));
    }
    return lines.join('\n');
  }

  // ─────────────────────────────────────────────────────────────────────────
  // isDialogUnlocked(dialogId)
  // True if another dialog's on_complete already called unlock_dialogs for it.
  // ─────────────────────────────────────────────────────────────────────────
  function isDialogUnlocked(dialogId) {
    return flagHas('dialog_unlocked:' + dialogId);
  }

  // ─────────────────────────────────────────────────────────────────────────
  // Area unlock helpers
  // ─────────────────────────────────────────────────────────────────────────
  function _unlockArea(areaId) {
    flagSet('area_unlocked:' + areaId);
    // Activate any .hotspot[data-area-id] elements on the map
    var sel = '.hotspot[data-area-id="' + areaId + '"], .hs-area[data-area-id="' + areaId + '"]';
    var els = document.querySelectorAll(sel);
    els.forEach(function (el) {
      el.classList.remove('no-interact');
      // Add a dot marker if the element has no visible indicator yet
      if (!el.querySelector('.hs-marker') && !el.querySelector('.hs-dot')) {
        var dot = document.createElement('div');
        dot.className = 'hs-dot';
        el.appendChild(dot);
      }
    });
  }

  function isAreaUnlocked(areaId) {
    return flagHas('area_unlocked:' + areaId);
  }

  // Re-apply area unlocks on every page load (flags persist across sessions)
  function _restoreAreas() {
    _load().forEach(function (f) {
      if (f.indexOf('area_unlocked:') === 0) {
        _unlockArea(f.slice('area_unlocked:'.length));
      }
    });
  }

  // ─────────────────────────────────────────────────────────────────────────
  // Terminal /flag command handler
  //
  // Usage from terminal.js input handler:
  //   var parts = text.slice(1).split(/\s+/);
  //   if (parts[0] === 'flag') { unlockHandleCmd(parts); return; }
  //
  // Subcommands:
  //   /flag set <name>       — flag-ის დაყენება
  //   /flag clear <name>     — flag-ის წაშლა
  //   /flag check <name>     — flag-ის შემოწმება
  //   /flag list             — ყველა flag-ის სია
  //   /flag reset            — ყველა flag-ის გასუფთავება
  // ─────────────────────────────────────────────────────────────────────────
  function unlockHandleCmd(parts) {
    var sub = (parts[1] || '').toLowerCase();
    var arg = parts.slice(2).join(' ').trim();

    switch (sub) {
      case 'set':
        if (!arg) { _pr('გამოყენება: /flag set <სახელი>', 'ter'); return true; }
        flagSet(arg);
        _pr('✓ flag დაყენდა: ' + arg, 'tok');
        return true;

      case 'clear':
      case 'del':
        if (!arg) { _pr('გამოყენება: /flag clear <სახელი>', 'ter'); return true; }
        if (flagClear(arg)) { _pr('✗ flag წაიშალა: ' + arg, 'tnf'); }
        else                { _pr('flag არ არსებობს: ' + arg, 'ter'); }
        return true;

      case 'check':
        if (!arg) { _pr('გამოყენება: /flag check <სახელი>', 'ter'); return true; }
        _pr(arg + ': ' + (flagHas(arg) ? '✓ true' : '✗ false'),
            flagHas(arg) ? 'tok' : 'tnf');
        return true;

      case 'list':
      case 'ls':
        var fl = flagList();
        if (!fl.length) {
          _pr('flags: ცარიელი', 'tdm');
        } else {
          _pr('flags (' + fl.length + '):', 'tsy');
          fl.forEach(function (f) { _pr('  · ' + f, 'tdm'); });
        }
        return true;

      case 'reset':
        flagReset();
        _pr('ყველა flag გასუფთავდა', 'tnf');
        return true;

      default:
        _pr('/flag  set|clear|check|list|reset', 'tsy');
        return true;
    }
  }

  // ─────────────────────────────────────────────────────────────────────────
  // Terminal print helper
  // Priority: tmPrint (terminal.js) → consolePrint (chat.js) → direct DOM
  // ─────────────────────────────────────────────────────────────────────────
  function _pr(msg, cls) {
    if (typeof global.tmPrint === 'function') {
      global.tmPrint(msg, cls || 'tdm');
      return;
    }
    // Direct DOM fallback (matches index.html terminal classes)
    var out = document.getElementById('tmOut');
    if (!out) return;
    var line = document.createElement('div');
    line.className = 'tl ' + (cls || 'tdm');
    line.textContent = msg;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
  }

  // ─────────────────────────────────────────────────────────────────────────
  // NOTE: terminal.js now owns /flag dispatch directly (delegates to
  // unlockHandleCmd via _tmFlagDelegate) for both single-line and multiline
  // input. The old capture-phase #tmIn auto-hook was removed — it only
  // covered the single-line path and is now redundant/dead weight.
  // ─────────────────────────────────────────────────────────────────────────

  // ─────────────────────────────────────────────────────────────────────────
  // Init
  // ─────────────────────────────────────────────────────────────────────────
  function unlockInit() {
    _restoreAreas();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', unlockInit);
  } else {
    unlockInit();
  }

  // ─────────────────────────────────────────────────────────────────────────
  // Public API
  // ─────────────────────────────────────────────────────────────────────────
  global.canTrigger            = canTrigger;
  global.completeDialog        = completeDialog;
  global.isDialogUnlocked      = isDialogUnlocked;
  global.isAreaUnlocked        = isAreaUnlocked;
  global.flagSet               = flagSet;
  global.flagClear             = flagClear;
  global.flagHas               = flagHas;
  global.flagList              = flagList;
  global.flagReset             = flagReset;
  global.unlockHandleCmd       = unlockHandleCmd;
  global.unlockInit            = unlockInit;
  global.parseUnlockHeaders    = parseUnlockHeaders;
  global.unparseUnlockHeaders  = unparseUnlockHeaders;

}(window));
</script>
<script>// ============================================================
//  bulk-parser.js — Bulk DSL → dialogue[] converter
//  Depends on: nothing (pure functions)
//  Load order: after objects.js, before ui-palette.js
// ============================================================

//
// DSL syntax reference:
//   @N [marker] title        — node start  (marker: ! ? ...)
//   [speaker] text           — named speaker block
//   [] text                  — player name placeholder (runtime: mdelo_nick || "მოგზაური")
//   <> text                  — object speaker (runtime: ობიექტის სახელი = _dlgTitle)
//   <სახელი> text            — object speaker (კასტომ სახელი)
//   plain text               — narrator (სახელის გარეშე)
//   {atmosphere text}        — atmosphere / effect line
//   [[label|url]]            — external link (inline)
//   [[object name]]          — map object link (inline)
//   -> text =>N              — choice button
//   [$name]                  — button-level: run saved macro "name" on click
//                               (resolved via window.runMacro — local scope wins
//                               over საერთო on a name clash, same as /macro)
//
// speaker encoding in HTML:
//   <b class="spk-player">[]</b>        — [] player placeholder
//   <b class="spk-object">\x01name</b>  — <> object (\x01 = empty = use _dlgTitle)
//   <b class="spk-named">name</b>       — [name] named speaker
//
// Returns: { nodes: Array, title: string, marker: string }
//   nodes  — dialogue[] ready for _editingDialogue
//   title  — object title from @0 header (may be "")
//   marker — object marker from @0 header (! ? 💬 or "")
//

// ── OBJ_PREFIX: internal marker for object speakers ─────────
const _OBJ_PREFIX = '__OBJ__';

function parseBulkDSL(raw) {
  const lines  = raw.replace(/\r\n/g, '\n').split('\n');
  const result = [];

  let cur     = null;   // node being built
  let speaker = null;   // null=narrator | ""=player | "\x01name"=object | "name"=named
  let textBuf = [];     // accumulated lines for current text block

  let rootTitle  = '';
  let rootMarker = '';

  // flush accumulated text buffer into cur.text as HTML
  function flush() {
    if (!cur || !textBuf.length) { textBuf = []; return; }
    const block = textBuf.join(' ').trim();
    if (!block) { textBuf = []; return; }

    let html;
    if (speaker === null) {
      // narrator — plain text, no speaker label
      html = _esc(block);
    } else if (speaker === '') {
      // [] — player placeholder, resolved at runtime
      html = '<b class="spk-player">[]</b> ' + _esc(block);
    } else if (typeof speaker === 'string' && speaker.startsWith(_OBJ_PREFIX)) {
      // <> or <name> — object speaker
      // store raw name after prefix; empty = use _dlgTitle at runtime
      const objName = speaker.slice(_OBJ_PREFIX.length);
      html = '<b class="spk-object">' + _esc(_OBJ_PREFIX + objName) + '</b> ' + _esc(block);
    } else {
      // [name] — named speaker
      html = '<b class="spk-named">' + _esc(speaker) + '</b> ' + _esc(block);
    }

    cur.text += (cur.text ? '<br>' : '') + html;
    textBuf = [];
  }

  for (const rawLine of lines) {
    const line = rawLine.trimEnd();

    // ── @N node header ──────────────────────────────────────
    if (/^@\d/.test(line)) {
      if (cur) { flush(); result.push(cur); }

      const m      = line.match(/^@(\d+)\s*(\.\.\.|[!?])?\s*(.*)/);
      const idx    = m ? m[1] : '0';
      const mrkRaw = m ? (m[2] || '').trim() : '';
      const title  = m ? (m[3] || '').trim() : '';
      const marker = mrkRaw === '!'   ? '!'   :
                     mrkRaw === '?'   ? '?'   :
                     mrkRaw === '...' ? '...' : '';

      if (idx === '0') { rootTitle = title; rootMarker = marker; }

      cur     = { id: 'node_' + idx, text: '', buttons: [] };
      speaker = null;
      textBuf = [];
      continue;
    }

    if (!cur) continue;

    // ── #if flag =>N conditional redirect ───────────────────────
    if (/^>>\s/.test(line)) {
      const ifM = line.match(/^>>\s+(\S+)\s*=>(\d+)/);
      if (ifM) cur.condition = { flag: ifM[1], target: 'node_' + ifM[2] };
      continue;
    }

    // ── choice line ──────────────────────────────────────────
    if (/^->/.test(line)) {
      flush();
      const btn = _parseBtn(line);
      if (btn) {
        cur.buttons.push(btn);
      }
      continue;
    }

    // ── atmosphere {text} ────────────────────────────────────
    const atmM = line.match(/^\{(.+)\}$/);
    if (atmM) {
      flush();
      speaker = null;
      cur.text += (cur.text ? '<br>' : '') + '✦ ' + _esc(atmM[1].trim());
      continue;
    }

    // ── object speaker <> or <name> ──────────────────────────
    // must be checked BEFORE [] to avoid conflict
    const objM = line.match(/^<([^>]*)>(.*)/);
    if (objM) {
      flush();
      speaker = _OBJ_PREFIX + objM[1].trim();  // \x01 + name (empty = auto)
      const rest = objM[2].trim();
      if (rest) textBuf.push(rest);
      continue;
    }

    // ── player/named speaker [] or [name] ────────────────────
    const spkM = line.match(/^\[([^\]]*)\](.*)/);
    if (spkM) {
      flush();
      speaker    = spkM[1];           // "" = player, "name" = named
      const rest = spkM[2].trim();
      if (rest) textBuf.push(rest);
      continue;
    }

    // ── empty line → flush block, reset speaker ──────────────
    if (!line.trim()) {
      flush();
      speaker = null;
      continue;
    }

    // ── regular text line (narrator) ─────────────────────────
    textBuf.push(line.trim());
  }

  // finalize last node
  if (cur) { flush(); result.push(cur); }

  return { nodes: result, title: rootTitle, marker: rootMarker };
}

// ── choice line parser ──────────────────────────────────────
//
// Full button DSL syntax:
//   -> label                     — close popup (or go to =>N)
//   -> label =>N                 — jump to node N
//   -> label |https://url        — open URL in new tab
//   -> label @@ზონის სახელი      — navigate map to area (fitAreas)
//   -> label [$macro_name]      — run saved macro (window.runMacro) on click —
//                                  the only action-token. Anything that used
//                                  to be a [^marker]/[+flag] token, or a
//                                  ->*/->!/->~/->+/->. notification, is now
//                                  done by the macro itself (e.g. a macro
//                                  body that runs /flag set, /marker set, or
//                                  /შეტყობინება)
//   -> label @@area |url =>N    — all modifiers can combine
//
function _parseBtn(line) {
  let rest = line.slice(2).trim();

  // extract =>N at end
  let nextNode = '';
  const nxtM = rest.match(/^(.*?)\s*=>(\d+)\s*$/);
  if (nxtM) {
    rest     = nxtM[1].trim();
    nextNode = 'node_' + nxtM[2];
  }

  // bracket token [$..] — extracted BEFORE |url and @@area. This regex
  // matches anywhere in the string regardless of position, so pulling it
  // out first means it can sit before OR after @@area / |url in the DSL
  // line without being swallowed by their end-anchored "\s*$" matching
  // (which previously ate a trailing bracket as part of the area/url
  // capture). [^marker]/[+flag] tokens are retired — both effects are now
  // expressed as saved macros (e.g. a macro that runs /flag set or
  // /marker set internally) and triggered the same way as any other
  // action: [$macro_name]. See TERMINAL_SCOPE instruction for the macro
  // side of this migration.

  // [$macro_name] — button-level: run saved macro on click (window.runMacro)
  const cmds = [];
  rest = rest.replace(/\[\$([^\]]+)\]/g, function(_, name) {
    cmds.push(name.trim());
    return '';
  }).trim();

  // extract trailing |url  (no spaces in URL)
  let link = '';
  const linkM = rest.match(/^(.*?)\s*\|(\S+)\s*$/);
  if (linkM) { link = linkM[2]; rest = linkM[1].trim(); }

  // extract trailing @@area name  (may contain spaces, must come after |url extraction)
  let area = '';
  const areaM = rest.match(/^(.*?)\s*@@(.+?)\s*$/);
  if (areaM) { area = areaM[2].trim(); rest = areaM[1].trim(); }

  if (!rest) return null;
  return { label: rest, nextNode, link, area, cmds };
}

// ── minimal HTML escape ─────────────────────────────────────
function _esc(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// ── dialogue[] → DSL serializer ────────────────────────────
function unparseDialogue(o) {
  const nodes  = o.dialogue || [];
  const title  = o.title  || o.lb || '';
  const marker = o.marker || '';
  if (!nodes.length && !title) return '';

  const mrkSym = marker === '!' ? '!' : marker === '?' ? '?' : marker === '💬' ? '...' : '';
  const lines  = [];

  nodes.forEach((node, ni) => {
    // node header
    const hdr = '@' + ni +
      (mrkSym && ni === 0 ? ' ' + mrkSym : '') +
      (title  && ni === 0 ? ' ' + title  : '');
    lines.push(hdr);

    // >> flag =>N condition
    if (node.condition) {
      lines.push('>> ' + node.condition.flag + ' =>' + node.condition.target.replace('node_', ''));
    }

    // text — strip HTML back to DSL
    if (node.text) {
      const plain = node.text
        .replace(/<br>/gi, '\n')
        // [] player placeholder
        .replace(/<b[^>]*class="spk-player"[^>]*>\[\]<\/b>\s*/gi, '[] ')
        // <> object speaker: extract stored name after \x01
        .replace(/<b[^>]*class="spk-object"[^>]*>([^<]*)<\/b>\s*/gi, (_, inner) => {
          // inner is escaped \x01name — unescape &lt; etc then strip \x01
          const raw = inner
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
          const name = raw.startsWith(_OBJ_PREFIX) ? raw.slice(_OBJ_PREFIX.length) : raw;
          return '<' + name + '> ';
        })
        // [name] named speaker
        .replace(/<b[^>]*class="spk-named"[^>]*>([^<]*)<\/b>\s*/gi, (_, inner) => {
          const name = inner
            .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
          return '[' + name + '] ';
        })
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g,  '<')
        .replace(/&gt;/g,  '>');
      plain.split('\n').forEach(l => {
        if (!l.trim()) return;
        const t = l.trim();
        if (t.startsWith('✦ ')) {
          lines.push('{' + t.slice(2) + '}');  // restore atmosphere syntax
        } else {
          lines.push(t);
        }
      });
    }

    // buttons
    (node.buttons || []).forEach(btn => {
      if (!btn.label) return;
      const next     = btn.nextNode ? ' =>' + btn.nextNode.replace('node_', '') : '';
      const areaPart = btn.area ? ' @@' + btn.area : '';
      const linkPart = btn.link ? ' |'  + btn.link : '';
      // NOTE: built via fromCharCode(36), not a literal dollar sign next to a
      // quote — export-html.js embeds this whole file as a *string*
      // replacement (tmpl.replace(/{{BULK_PARSER_JS}}/g, bulkParserJS)), and a
      // dollar sign directly followed by an apostrophe in that string is a
      // special JS replace-token (inserts the text after the match) — it
      // would splice the rest of the HTML template into the middle of this
      // script and corrupt the export.
      const cmdPart  = (btn.cmds || []).map(c => ' [' + String.fromCharCode(36) + c + ']').join('');
      const suffix   = areaPart + linkPart + cmdPart + next;
      lines.push('-> ' + btn.label + suffix);
    });

    if (ni < nodes.length - 1) lines.push('');
  });

  return lines.join('\n');
}

function parseLinks(t) {
  let o = '', i = 0;
  while (i < t.length) {
    const s = t.indexOf('[[', i);
    if (s < 0) { o += t.slice(i); break; }
    o += t.slice(i, s);
    const e = t.indexOf(']]', s + 2);
    if (e < 0) { o += t.slice(s); break; }
    const inner2 = t.slice(s + 2, e);
    const p = inner2.indexOf('|');
    if (p < 0) { o += inner2; }
    else {
      const lbl = inner2.slice(0, p), url = inner2.slice(p + 1).trim();
      if (url.startsWith('menu:')) {
        const slug = url.slice(5).trim();
        o += '<a href="#" class="gm-link" data-menu-slug="' + _escAttr(slug) + '" style="color:#58a6ff;">' + lbl + '</a>';
      } else {
        const safe = (url.startsWith('http') || url.startsWith('//') || url.startsWith('/')) ? url : '#';
        o += '<a href="' + safe + '" target="_blank" style="color:#58a6ff;">' + lbl + '</a>';

    i = e + 2;
  }
  return o.replace(/\n/g, '<br>');

function _tracePoly(cells, TS) {

  cells.forEach(key => {
    const [r,cc] = key.split(',').map(Number);
    const px=cc*TS, py=r*TS;
    if (!cells.has(r+','+(cc-1))) edgeSet.add(norm(px,py,px,py+TS));
    if (!cells.has(r+','+(cc+1))) edgeSet.add(norm(px+TS,py,px+TS,py+TS));
    if (!cells.has((r-1)+','+cc)) edgeSet.add(norm(px,py,px+TS,py));
    if (!cells.has((r+1)+','+cc)) edgeSet.add(norm(px,py+TS,px+TS,py+TS));
  });
  const edges = [...edgeSet].map(s=>s.split(',').map(Number));
  const adj = new Map();
  edges.forEach(([x1,y1,x2,y2],i) => {
    const k1=x1+','+y1, k2=x2+','+y2;
    if (!adj.has(k1)) adj.set(k1,[]);
    if (!adj.has(k2)) adj.set(k2,[]);

  for (let si=0; si<edges.length; si++) {
    if (used.has(si)) continue;

    let cx=sx, cy=sy, ci=si;
    const poly = [];

      used.add(ci);
      const [x1,y1,x2,y2]=edges[ci];
      poly.push([cx,cy]);

      const nb=(adj.get(cx+','+cy)||[]).find(i=>!used.has(i));

let _twTimer = null;
function _typewriter(el, text, speed, onDone) {
  if (_twTimer) { clearInterval(_twTimer); _twTimer = null; }
  el.textContent = '';
  if (!text) { if (onDone) onDone(); return; }
  let i = 0;
  _twTimer = setInterval(() => { el.textContent += text[i++]; if (i >= text.length) { clearInterval(_twTimer); _twTimer = null; if (onDone) onDone(); } }, speed);
}
function _twSpeed(type) {
  if (type === 'emergency' || type === 'danger') return 25;
  if (type === 'warning') return 45;
  return 35;
}
function _typewriterHTML(el, html, speed, onDone, onTick) {
  if (_twTimer) { clearInterval(_twTimer); _twTimer = null; }
  el.innerHTML = '';
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  const nodes = Array.from(tmp.childNodes);
  let ni = 0, ci = 0, cur = null, _done = false;
  function next() {
    if (ni >= nodes.length) { if (!_done) { _done = true; if (onDone) onDone(); } return; }
    const node = nodes[ni];
    if (node.nodeType === 3) {
      if (!cur) { cur = document.createTextNode(''); el.appendChild(cur); }
      const full = node.textContent;
      if (ci < full.length) { cur.textContent += full[ci++]; if (onTick) onTick(); }
      else { ni++; ci = 0; cur = null; }
    } else { el.appendChild(node.cloneNode(true)); ni++; ci = 0; cur = null; if (onTick) onTick(); }
  }
  _twTimer = setInterval(() => { next(); if (ni >= nodes.length && !_done) { clearInterval(_twTimer); _twTimer = null; _done = true; if (onDone) onDone(); } }, speed);
}

  const canVote = typeof window._tierAtLeast === 'function' && window._tierAtLeast('resident');
  const yesBtn = document.getElementById('cpYes'), noBtn = document.getElementById('cpNo');
  if (yesBtn) yesBtn.style.display = canVote ? '' : 'none';
  if (noBtn) noBtn.style.display = canVote ? '' : 'none';
  p.style.display = 'flex';
  requestAnimationFrame(() => p.classList.add('show'));
  loadConsensusVotes(n.id);
  _subscribeConsensusVotes(n.id);
}

function _renderConsensusFeed() {
  const feed = document.getElementById('cpFeed');
  feed.innerHTML = '';
  if (!_consensusVotes.length) {
    feed.innerHTML = '<div class="cp-feed-empty">ჯერ არავის უხმია</div>';
  } else {
    _consensusVotes.forEach(v => {
      const row = document.createElement('div');
      row.className = 'cp-feed-row';
      row.innerHTML = '<span>' + (v.vote ? '🔘' : '❌') + '</span><span>' + (v.voter_name || '') + '</span>';
      feed.appendChild(row);
    });
  }
  const myName = window.myDisplayName ? window.myDisplayName() : localStorage.getItem('mdelo_sender');
  const myUid  = window.myUserId ? window.myUserId() : null;
  const mine = myUid && _consensusVotes.find(v => v.user_id === myUid);
  _setConsensusToggle(mine ? mine.vote : null);
}

// Voting requires login now — RLS enforces auth.uid() = user_id on write, and
// per the tier decisions, voting itself is resident+ only (caretaker never
// gets this UI surfaced in the first place — see cpYes/cpNo gating upstream).
async function castConsensusVote(vote) {
  if (!_curConsensusNotif) return;
  if (typeof window.isLoggedIn !== 'function' || !window.isLoggedIn()) {
    if (typeof toast === 'function') toast('⚠️ ხმის მისაცემად საჭიროა შესვლა — სცადე /ლოგინი');
    return;
  }
  if (typeof window._tierAtLeast !== 'function' || !window._tierAtLeast('resident')) {
    if (typeof toast === 'function') toast('⚠️ ხმის მიცემა resident-ის და უფრო მაღალი tier-ისთვისაა');
    return;
  }
  const uid = window.myUserId();
  const name = window.myDisplayName();

  // optimistic: update local array immediately, no flicker
  const existing = _consensusVotes.findIndex(v => v.user_id === uid);
  if (existing >= 0) {
    _consensusVotes[existing] = { ..._consensusVotes[existing], vote: vote, voted_at: new Date().toISOString() };
  } else {
    _consensusVotes.push({ notification_id: _curConsensusNotif.id, user_id: uid, voter_name: name, vote: vote, voted_at: new Date().toISOString() });
  }
  _renderConsensusFeed();
  _evaluateConsensusState();

  // persist to Supabase in background
  _voteWritePending = true;
  try {
    await fetch(SUPA_URL + '/rest/v1/consensus_votes?on_conflict=notification_id,user_id', {
      method: 'POST',
      headers: Object.assign({
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      }, _authHeaders()),
      body: JSON.stringify({
        notification_id: _curConsensusNotif.id,
        user_id: uid,
        voter_name: name,
        vote: vote,
        voted_at: new Date().toISOString()
      })
    });
    // wait for DB to commit before allowing realtime/fetch to overwrite local state
    setTimeout(() => {
      _voteWritePending = false;
      if (_curConsensusNotif) loadConsensusVotes(_curConsensusNotif.id);
    }, 800);
  } catch (e) { _voteWritePending = false; }
}

function _evaluateConsensusState() {
  const n = _curConsensusNotif;
  if (!n) return;
  const statusEl = document.getElementById('cpStatus');
  const total = _consensusVotes.length;
  const quorum = n.quorum_count || 0;
  const quorumMet = !!quorum && total >= quorum;
  n._allVoted = quorumMet;

  const extra = quorum ? (total + '/' + quorum + ' ხმა') : (total + ' ხმა');
  let label, color;
  if (quorumMet) {
    const allAgree = _consensusVotes.every(v => v.vote === true);
    const RESULTS = {
      project: ['✅ პროექტი მხარდაჭერილია!', '🚫 პროექტი უარყოფილია!'],
      done:    ['✅ პროექტი შესრულდა!',       '🚫 პროექტი შეჩერდა!'],
    };
    const pair = RESULTS[n.type] || ['✅ კონსენსუსი შედგა!', '🚫 კონსენსუსი არ შედგა!'];
    label = allAgree ? pair[0] : pair[1];
    color = allAgree ? '#4ade80' : '#f85149';
    // fire terminal_cmd once on positive outcome
    if (allAgree && n.terminal_cmd && !_executedTerminalCmds.has(n.id)) {
      _executedTerminalCmds.add(n.id);
      if (typeof window.tmRun === 'function') window.tmRun(n.terminal_cmd);
      else if (typeof window.runMacro === 'function') window.runMacro(n.terminal_cmd);
    }
  } else {
    label = '📜 განხილვა მიმდინარეობს';
    color = '#55aa33';
  }
  statusEl.style.color = color;
  statusEl.textContent = label + ' · ' + extra;
}

function _subscribeConsensusVotes(notifId) {
  if (typeof supabase === 'undefined') return;
  if (_consensusChannel) { try { _consensusChannel.unsubscribe(); } catch (e) {} _consensusChannel = null; }
  try {
    const client = supabase.createClient(SUPA_URL, SUPA_KEY);
    _consensusChannel = client.channel('consensus-' + notifId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'consensus_votes', filter: 'notification_id=eq.' + notifId },
        () => loadConsensusVotes(notifId))
      .subscribe();
  } catch (e) {}
}

const _MAP_ID = (_CFG && _CFG.title) ? _CFG.title : 'map';

// Find _OBJS index by hotspot data-title
function _findOiByTitle(title) {
  var hs = document.querySelector('.hotspot[data-title="' + title.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"]:not(.hs-area):not(.no-interact)');
  return (hs && hs.dataset.oi != null) ? +hs.dataset.oi : -1;
}

// Update hotspot DOM marker element.
// mk = internal marker string: '!' | '?' | '💬' | ''
// Creates .hs-marker if missing; hides/shows .hs-dot accordingly.
function _applyMarkerDom(hsEl, mk) {
  if (!hsEl) return;
  var dotEl = hsEl.querySelector('.hs-dot');
  var mkEl  = hsEl.querySelector('.hs-marker');
  if (mk) {
    if (!mkEl) {
      mkEl = document.createElement('div');
      hsEl.appendChild(mkEl);
    }
    // must set color class — without it the element is invisible
    mkEl.className   = mk === '!' ? 'hs-marker exc' : mk === '?' ? 'hs-marker q' : 'hs-marker chat';
    mkEl.textContent = mk === '💬' ? '...' : mk;
    mkEl.style.display = '';
    if (dotEl) dotEl.style.display = 'none';
  } else {
    if (mkEl)  mkEl.style.display  = 'none';
    if (dotEl) dotEl.style.display = '';
  }
  // persist by oi (unique per object, avoids title collisions)
  if (!_mkRestoring) {
    var _oi = hsEl.dataset.oi;
    if (_oi != null) _markerSave(_oi, mk || '');
  }
}

// ── marker persistence (keyed by oi, not title) ──────────────
var _MK_KEY = 'mdelo_mk_' + ((_CFG && _CFG.title) ? _CFG.title : 'map').replace(/[^a-zA-Z0-9ა-ჿ_-]/g, '_');
var _mkRestoring = false;
function _markerSave(oi, mk) {
  try {
    var s = JSON.parse(localStorage.getItem(_MK_KEY) || '{}');
    if (mk === '') delete s[oi]; else s[oi] = mk;
    localStorage.setItem(_MK_KEY, JSON.stringify(s));
  } catch(e) {}
}
function _markerRestore() {
  try {
    var s = JSON.parse(localStorage.getItem(_MK_KEY) || '{}');
    _mkRestoring = true;
    Object.keys(s).forEach(function(oi) {
      var el = document.querySelector('.hotspot[data-oi="' + oi + '"]:not(.hs-area)');
      if (el) _applyMarkerDom(el, s[oi]);
    });
    _mkRestoring = false;
  } catch(e) { _mkRestoring = false; }
}

// Patch _OBJS[oi].dialogue with data from Supabase row
function _applyDlgOverride(row) {
  if (!row || !row.obj_title || !row.nodes_json) return;
  var oi = _findOiByTitle(row.obj_title);
  if (oi < 0 || typeof _OBJS === 'undefined' || !_OBJS[oi]) return;

  var nodes = (Array.isArray(row.nodes_json) ? row.nodes_json : []).map(function(node) {
    if (!node || !node.text) return node;
    return Object.assign({}, node, { text: node.text.replace(/__OBJ___OBJ__/g, '__OBJ__') });
  });
  _OBJS[oi].dialogue = nodes;

  if (row.dsl && typeof parseBulkDSL === 'function') {
    try {
      var dslRaw = row.dsl;
      if (typeof parseUnlockHeaders === 'function') {
        var unlockData = parseUnlockHeaders(dslRaw);
        dslRaw = unlockData.dsl;
        _OBJS[oi].requires    = unlockData.requires;
        _OBJS[oi].on_complete = unlockData.on_complete;
        if (unlockData.on_complete && unlockData.on_complete.set_markers) {
          unlockData.on_complete.set_markers.forEach(function(m) {
            var el = document.querySelector('.hotspot[data-title="' + m.title + '"]:not(.hs-area)');
            if (el) _applyMarkerDom(el, m.mk);
            var tOi = el ? el.dataset.oi : null;
            if (tOi != null && _OBJS[+tOi]) _OBJS[+tOi].marker = m.mk === '~' ? '...' : m.mk;
          });
        }
      }
      var parsed = parseBulkDSL(dslRaw.trim() || '@0\n');
      var mk = parsed.marker === '...' ? '💬' : (parsed.marker || '');
      if (mk) _OBJS[oi].marker = mk;
      if (parsed.title) { _OBJS[oi].lb = parsed.title; _OBJS[oi].title = parsed.title; }
      var hsEl = document.querySelector('.hotspot[data-oi="' + oi + '"]:not(.hs-area)');
      // only apply Supabase marker if: has marker AND user has no local override
      var _mkStored = JSON.parse(localStorage.getItem(_MK_KEY) || '{}');
      if (mk && !(_mkStored.hasOwnProperty(String(oi)))) {
        _applyMarkerDom(hsEl, mk);
      }
      // sync window.DIALOGS so completeDialog sees updated requires/on_complete
      if (window.DIALOGS) {
        var _dlgKey = 'dlg_' + oi;
        if (window.DIALOGS[_dlgKey]) {
          window.DIALOGS[_dlgKey].requires    = _OBJS[oi].requires;
          window.DIALOGS[_dlgKey].on_complete = _OBJS[oi].on_complete;
          window.DIALOGS[_dlgKey].dialogue    = _OBJS[oi].dialogue;
        }
      }
    } catch(e) {}
  }
}

// ── menu overrides (Supabase) ──
// Allows community members to extend the burger menu via the terminal's
// /cd /md /ფოთოლი /rm commands (see terminal.js). All viewers get the same
// merged structure on every page load — there is no realtime channel for this,
// just a fetch+merge into _CFG.menu before the burger menu is ever opened.
//
// Table: menu_overrides (map_id, node_id) unique
//   node_id    — Fixed ID of the node being touched (matches node.id in _CFG.menu,
//                survives re-export since menu-builder.js never regenerates ids)
//   parent_id  — only set when node_id is a brand-new node created via /md;
//                null means either "root-level" or "not a new node" (existing baked node)
//   icon/title — only meaningful for brand-new nodes
//   items_json — the CURRENT full items[] array for that node (snapshot, not a delta —
//                mirrors how dialogue_overrides stores the full nodes_json each time)
//   deleted    — tombstone; true means this node (and anything still hanging under it)
//                should be removed from the tree on load

// Find a node anywhere in _CFG.menu by its Fixed ID.
function _mnFindNode(id, nodes) {
  nodes = nodes || (_CFG.menu || []);
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].id === id) return nodes[i];
    if (nodes[i].children && nodes[i].children.length) {
      var f = _mnFindNode(id, nodes[i].children);
      if (f) return f;
    }
  }
  return null;
}

// Remove a node anywhere in _CFG.menu by its Fixed ID (used for `deleted` tombstones).
function _mnRemoveNodeById(id, nodes) {
  nodes = nodes || (_CFG.menu || []);
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].id === id) { nodes.splice(i, 1); return true; }
    if (nodes[i].children && nodes[i].children.length) {
      if (_mnRemoveNodeById(id, nodes[i].children)) return true;
    }
  }
  return false;
}

// Apply fetched menu_overrides rows onto _CFG.menu in place.
// Pass 1 attaches brand-new nodes — iteratively, since a new node's parent may
// itself be another new node that appears later/earlier in the unordered rows.
// Pass 2 applies items snapshots + deletions to every touched node (including
// ones just attached in pass 1).
function _applyMenuOverrides(rows) {
  if (!_CFG.menu) _CFG.menu = [];

  var pending = rows.filter(function (r) { return r.parent_id !== null && !r.deleted; });
  for (var pass = 0; pass < 50 && pending.length; pass++) {
    var stillPending = [];
    pending.forEach(function (r) {
      if (_mnFindNode(r.node_id)) return; // already attached
      var parentList;
      if (!r.parent_id) { parentList = _CFG.menu; }
      else {
        var parentNode = _mnFindNode(r.parent_id);
        parentList = parentNode ? (parentNode.children || (parentNode.children = [])) : null;
      }
      if (!parentList) { stillPending.push(r); return; }
      parentList.push({ id: r.node_id, icon: r.icon || '📁', title: r.title || '', items: [], children: [] });
    });
    pending = stillPending;
  }

  rows.forEach(function (r) {
    if (r.deleted) { _mnRemoveNodeById(r.node_id); return; }
    var node = _mnFindNode(r.node_id);
    if (node && Array.isArray(r.items_json)) node.items = r.items_json;
  });
}

//                           (popup მხოლოდ სახელს სთხოვს ამ შემთხვევაში)
async function _tmLogin(args) {
  if (typeof window.isLoggedIn === 'function' && window.isLoggedIn()) {
    _tmL('tok', '✓ ავტორიზებული ხარ, როგორც ' + window.myDisplayName() + '  (tier: ' + window.myTier() + ')');
    return;
  }
  var email = (args || []).join(' ').trim();
  var name = '';

  if (typeof window.showLoginModal !== 'function') { _tmL('ter', '✗ auth engine ვერ მოიძებნა (runtime.js?)'); return; }
  var res = await window.showLoginModal(email || null);
  if (!res) return; // გააუქმა
  email = res.email;
  name = res.name;

  if (name) { try { localStorage.setItem('mdelo_pending_name', name); } catch (e) {} }

  if (typeof window.requestMagicLink !== 'function') { _tmL('ter', '✗ auth engine ვერ მოიძებნა (runtime.js?)'); return; }
  _tmL('ti', '/ლოგინი ' + email);
  _tmL('tdm', 'იგზავნება login ბმული "' + email + '"-ზე...');
  var lres = await window.requestMagicLink(email);
  if (lres === true) _tmL('tok', '✓ შეამოწმე ელფოსტა — login ბმული გამოგზავნილია');
  else _tmL('ter', '✗ ვერ გაიგზავნა: ' + (lres && lres.msg ? lres.msg : 'უცნობი შეცდომა'));
}

// /სტატუსი <notification_id> — HIDDEN deliberately: not in _TMCMDS, not in
// _tmHelp, no autocomplete. Only ever meant to run as a notification's own
// terminal_cmd (auto-attached by btn.applyTier in runtime.js), auto-executed
// once the existing consensus-quorum UI detects unanimity. It is still safe
// to type by hand or forge, though — resolve_tier_change() (SQL, security
// definer) re-counts votes itself and no-ops unless real quorum is met, so
// hiding this command is a courtesy, not the actual protection.
async function _tmResolveStatus(args) {
  var notifId = (args || [])[0];
  if (!notifId) return; // silent — this should never be invoked by a person directly
  try {
    var r = await fetch(SUPA_URL + '/rest/v1/rpc/resolve_tier_change', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, _authHeaders()),
      body: JSON.stringify({ notif_id: notifId })
    });
    var data = r.ok ? await r.json() : null;
    if (data && data.ok) {
      _tmL('tok', '✓ tier შეიცვალა — ' + data.tier);
      if (typeof loadNotifs === 'function') loadNotifs();
    } else {
      _tmL('tdm', 'tier ცვლილება ჯერ არ დამტკიცებულა (' + (data && data.reason ? data.reason : 'უცნობი') + ')');
    }
  } catch (e) { /* silent — this is a background auto-command */ }
}

// ── /მენიუ/<section>/<section>/.../<leaf-item-index?> — deep link ──
// Drills the visible game-menu UI (runtime.js's _gmShowPanel/_gmOpenOverlay)
// straight to a nested section or a specific item inside a leaf, instead of
// making the person tap through each level by hand.
// Resolves a section-title path (["მაცხოვრებლები","გიორგი","დღიური"]) to its
// node object, walking _gmCfg.menu top-down. Returns null + logs an error if
// any segment doesn't match. Shared by /მენიუ deep-link and /todo toggle.
function _tmFindMenuNodeByPath(segs) {
  if (!_gmCfg) _gmCfg = _CFG;
  var nodes = _gmCfg.menu || [], node = null;
  for (var i = 0; i < segs.length; i++) {
    node = nodes.find(function (n) { return (n.title || '').trim() === segs[i]; });
    if (!node) { _tmL('ter', 'მენიუში ვერ მოიძებნა: "' + segs[i] + '"'); return null; }
    if (i < segs.length - 1) {
      if (!node.children || !node.children.length) { _tmL('ter', '"' + node.title + '" — ქვესექციები არ აქვს'); return null; }
      nodes = node.children;
    }
  }
  return node;
}

function _tmMenuOpenPath(segs) {
  if (!segs.length) { _tmMenu(); return; }
  if (!_gmCfg) _gmCfg = _CFG;

  var itemIdx = null;
  if (/^\d+$/.test(segs[segs.length - 1])) { itemIdx = parseInt(segs[segs.length - 1]); segs = segs.slice(0, -1); }
  if (!segs.length) { _tmMenu(); return; }

  var nodes = _gmCfg.menu || [], path = [], node = null;
  for (var i = 0; i < segs.length; i++) {
    node = nodes.find(function (n) { return (n.title || '').trim() === segs[i]; });
    if (!node) { _tmL('ter', 'მენიუში ვერ მოიძებნა: "' + segs[i] + '"'); return; }
    if (i < segs.length - 1) {
      if (!node.children || !node.children.length) { _tmL('ter', '"' + node.title + '" — ქვესექციები არ აქვს'); return; }
      path.push({ title: node.title, nodes: node.children });
      nodes = node.children;
    }
  }

  var gm = document.getElementById('gameMenu');
  var wasOpen = gm.classList.contains('open');
  if (!wasOpen) toggleMenu();

  if (node.items && node.items.length) {
    _gmOpenOverlay(node, nodes, path, !wasOpen);
    if (itemIdx != null) {
      setTimeout(function () {
        var body = document.getElementById('gmOverlayBody');
        var el = body.children[itemIdx];
        if (!el) { _tmL('ter', 'item [' + itemIdx + '] არ არსებობს'); return; }
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        var orig = el.style.backgroundColor;
        el.style.transition = 'background-color .3s';
        el.style.backgroundColor = 'rgba(0,255,136,.25)';
        setTimeout(function () { el.style.backgroundColor = orig; }, 1200);
      }, 80);
    }
  } else if (node.children && node.children.length) {
    _gmShowPanel(node.children, path.concat([{ title: node.title, nodes: node.children }]));
  } else {
    _gmShowPanel(nodes, path);
  }
  _tmL('tok', '☰ → ' + segs.join('/') + (itemIdx != null ? '/' + itemIdx : ''));
}

// Slash-segmented path: "/a/b/c" (absolute, from root) or "a/b/c" (relative, from cwd).
// ".." is a valid segment too ("../sibling"). Resolved against a throwaway copy of
// the stack first — Unix `cd` semantics: any missing segment aborts the WHOLE move,
// cwd stays exactly where it was (no partial hop).
function _tmMenuCdPath(path) {

  var stack = absolute ? [] : _tmMenuStack.slice();

  for (var i = 0; i < segments.length; i++) {
    var seg = segments[i];
    if (seg === '.') continue;
    if (seg === '..') {
      if (!stack.length) {
        _tmL('ter', 'root-ზე მაღლა ასვლა შეუძლებელია — სეგმენტი ' + (i + 1) + '/' + segments.length + ' (".."), cwd უცვლელია');
        return;
      }
      stack.pop();
      continue;
    }
    var topNode  = stack.length ? stack[stack.length - 1] : null;
    var children = topNode ? (topNode.children || []) : (_CFG.menu || []);
    var found = children.find(function (n) { return (n.title || '').trim() === seg; });
    if (!found) {
      _tmL('ter', 'ვერ მოიძებნა: "' + seg + '" (სეგმენტი ' + (i + 1) + '/' + segments.length + ') — cwd უცვლელია');
